[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
# The distribution is `preflight-gate`; the import name and the command are both
# still `preflight`. PyPI's `preflight` belongs to an unrelated Django project
# last released in 2015, so `pip install preflight` installs somebody else's
# package -- which the docs told people to do until 0.6.0.
name = "preflight-gate"
version = "0.8.0a2"
description = "Decide whether a plugin may load from its manifest alone, before any of its code runs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Neil Mahure" }]
keywords = ["plugins", "manifest", "loader", "fail-closed", "agent-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/croresnos/preflight"
Repository = "https://github.com/croresnos/preflight"
Issues = "https://github.com/croresnos/preflight/issues"

[project.optional-dependencies]
dev = [
    "bandit>=1.7,<2",
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.12,<1",
    "twine>=7,<8",
]

[project.scripts]
preflight = "preflight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

# The demo is the fastest way to understand what preflight refuses and why, so a
# plain `pip install` has to be able to run it. Without this the examples live
# only in a source checkout and `preflight demo` tells everyone to go clone the
# repository -- which is the one instruction that loses the reader.
[tool.hatch.build.targets.wheel.force-include]
"examples/plugins" = "preflight/_examples/plugins"

[tool.hatch.build.targets.sdist]
exclude = ['/scripts/coldstart']
include = [
    "/src",
    "/tests",
    "/examples",
    "/scripts",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
# Keeps a fresh clone honest: `pytest` works with no editable install.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["preflight"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
packages = ["preflight"]
mypy_path = "src"
