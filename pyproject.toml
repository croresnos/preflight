[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "preflight"
version = "0.3.0"
description = "Decide whether a plugin may load from its manifest alone, before any of its code runs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["plugins", "manifest", "loader", "fail-closed", "agent-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
preflight = "preflight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.pytest.ini_options]
# Keeps a fresh clone honest: `pytest` works with no editable install.
pythonpath = ["src"]
testpaths = ["tests"]
