name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing version tag to build (for example, v0.7.0)
        required: true
        type: string
      repository:
        description: Destination index
        required: true
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}
      - name: Prove the checkout is the requested version tag
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          release_ref = os.environ['RELEASE_REF']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+)?', release_ref):
              raise SystemExit(f'release_ref is not a supported version tag: {release_ref!r}')
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if release_ref != f'v{version}':
              raise SystemExit(f'tag {release_ref!r} does not match package version {version!r}')
          tags = subprocess.check_output(
              ['git', 'tag', '--points-at', 'HEAD'], text=True
          ).splitlines()
          if release_ref not in tags:
              raise SystemExit(f'HEAD is not tagged {release_ref!r}: {tags!r}')
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Build reproducibly
        run: |
          python -m pip install --upgrade build twine
          SOURCE_DATE_EPOCH=1704067200 python -m build --outdir .build-1
          SOURCE_DATE_EPOCH=1704067200 python -m build --outdir .build-2
          python - <<'PY'
          from pathlib import Path

          first = {path.name: path.read_bytes() for path in Path(".build-1").iterdir()}
          second = {path.name: path.read_bytes() for path in Path(".build-2").iterdir()}
          if first != second:
              raise SystemExit("build artifacts are not byte-for-byte reproducible")
          PY
          mv .build-1 dist
      - name: Validate archive contents and metadata
        run: python scripts/audit_dist.py dist && python -m twine check dist/*
      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/preflight-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Fetch back the exact TestPyPI wheel and exercise it
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          filename="$(basename "$wheel")"
          version="${filename#preflight_gate-}"
          version="${version%-py3-none-any.whl}"
          for attempt in {1..12}; do
            if python -m pip download --pre --no-deps --index-url https://test.pypi.org/simple/ "preflight-gate==${version}" --dest fetched; then
              break
            fi
            if [[ $attempt == 12 ]]; then
              echo "TestPyPI did not expose preflight-gate==${version} after 12 attempts" >&2
              exit 1
            fi
            echo "Waiting for TestPyPI simple-index propagation (attempt ${attempt}/12)"
            sleep 10
          done
          cmp "$wheel" "fetched/$filename"
          python -m venv /tmp/testpypi
          /tmp/testpypi/bin/python -m pip install --upgrade pip
          /tmp/testpypi/bin/python -m pip install pydantic
          /tmp/testpypi/bin/python -m pip install --no-deps "fetched/$filename"
          /tmp/testpypi/bin/preflight --version
          /tmp/testpypi/bin/preflight demo
          if [[ $version != 0.7.* ]]; then
            /tmp/testpypi/bin/preflight doctor --json
          fi

  pypi:
    if: github.event_name == 'release' || inputs.repository == 'pypi'
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/preflight-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
