name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: Destination index
        required: true
        type: choice
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Build reproducibly
        run: |
          python -m pip install --upgrade build twine
          SOURCE_DATE_EPOCH=1704067200 python -m build --outdir .build-1
          SOURCE_DATE_EPOCH=1704067200 python -m build --outdir .build-2
          python - <<'PY'
          from pathlib import Path

          first = {path.name: path.read_bytes() for path in Path(".build-1").iterdir()}
          second = {path.name: path.read_bytes() for path in Path(".build-2").iterdir()}
          if first != second:
              raise SystemExit("build artifacts are not byte-for-byte reproducible")
          PY
          mv .build-1 dist
      - name: Validate archive contents and metadata
        run: python scripts/audit_dist.py dist && python -m twine check dist/*
      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/preflight-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/
      - name: Fetch back the exact TestPyPI wheel and exercise it
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          filename="$(basename "$wheel")"
          version="${filename#preflight_gate-}"
          version="${version%-py3-none-any.whl}"
          python -m pip download --no-deps --index-url https://test.pypi.org/simple/ "preflight-gate==${version}" --dest fetched
          cmp "$wheel" "fetched/$filename"
          python -m venv /tmp/testpypi
          /tmp/testpypi/bin/python -m pip install --upgrade pip
          /tmp/testpypi/bin/python -m pip install pydantic
          /tmp/testpypi/bin/python -m pip install --no-deps "fetched/$filename"
          /tmp/testpypi/bin/preflight --version
          /tmp/testpypi/bin/preflight demo
          /tmp/testpypi/bin/preflight doctor --json

  pypi:
    if: github.event_name == 'release' || inputs.repository == 'pypi'
    needs: [build, verify-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/preflight-gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
