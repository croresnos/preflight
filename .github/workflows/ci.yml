# The suite, on every Python and both OSes that matter -- and then the shipped
# artefact, separately.
#
# The second job is not redundant. `packaging` once broke while every other test
# was green: the examples live outside `src/`, a wheel does not collect them by
# default, and an installed copy lost `preflight demo` without anything failing.
# `scripts/uat.sh` builds a wheel for that reason and this borrows the habit.
name: CI

on:
  push:
    branches: [main, settings]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional. `settings.py` decides whether a planted file
        # is inside an inspected folder with `os.path.normcase`, and resolves the
        # user config directory from `%APPDATA%`. Neither branch runs anywhere
        # else, and both are load-bearing for the settings threat model.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  quality:
    name: deterministic quality and security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m bandit -q -r src
      - run: python -m pip_audit .
      - run: python -m pytest --cov --cov-report=term-missing -q

  build:
    name: reproducible, inspected distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          SOURCE_DATE_EPOCH=1704067200 python -m build --outdir .build-1
          SOURCE_DATE_EPOCH=1704067200 python -m build --outdir .build-2
          python - <<'PY'
          from pathlib import Path

          first = {path.name: path.read_bytes() for path in Path(".build-1").iterdir()}
          second = {path.name: path.read_bytes() for path in Path(".build-2").iterdir()}
          if first != second:
              raise SystemExit("build artifacts are not byte-for-byte reproducible")
          PY
          mv .build-1 dist

      - name: Audit distributions
        run: python -m twine check dist/* && python scripts/audit_dist.py dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  artifact-uat:
    name: ${{ matrix.artifact }} UAT (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        artifact: [wheel, sdist]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: distributions
          path: dist

      - name: Install the selected artifact into a clean environment
        shell: python
        env:
          ARTIFACT_KIND: ${{ matrix.artifact }}
        run: |
          import os
          import pathlib
          import subprocess
          import venv

          venv.create(".artifact-uat", with_pip=True)
          scripts = "Scripts" if os.name == "nt" else "bin"
          python = pathlib.Path(".artifact-uat") / scripts / (
              "python.exe" if os.name == "nt" else "python"
          )
          pattern = "*.whl" if os.environ["ARTIFACT_KIND"] == "wheel" else "*.tar.gz"
          artifacts = list(pathlib.Path("dist").glob(pattern))
          if len(artifacts) != 1:
              raise SystemExit(f"expected one {pattern} artifact, found {artifacts}")
          subprocess.check_call([str(python), "-m", "pip", "install", "--upgrade", "pip"])
          subprocess.check_call([str(python), "-m", "pip", "install", str(artifacts[0])])

      - name: Exercise the installed command away from the checkout
        shell: python
        run: |
          import os
          import pathlib
          import subprocess

          scripts = "Scripts" if os.name == "nt" else "bin"
          command = pathlib.Path(".artifact-uat") / scripts / (
              "preflight.exe" if os.name == "nt" else "preflight"
          )
          outside = pathlib.Path(".artifact-uat-cwd")
          outside.mkdir()
          subprocess.check_call([str(command.resolve()), "--version"], cwd=outside)
          subprocess.check_call([str(command.resolve()), "doctor", "--json"], cwd=outside)
          demo = subprocess.run(
              [str(command.resolve()), "demo"], cwd=outside, text=True, capture_output=True
          )
          if demo.returncode != 0 or "2 loaded, 3 refused" not in demo.stdout:
              raise SystemExit(demo.stdout + demo.stderr)
          refused = subprocess.run(
              [str(command.resolve()), "check", str(pathlib.Path("examples/plugins").resolve())],
              cwd=outside,
          )
          if refused.returncode != 1:
            raise SystemExit(f"check returned {refused.returncode}, expected 1")

  native:
    name: Blast Chambers Rust gates
    runs-on: windows-2025
    defaults:
      run:
        working-directory: native/blast-chambers
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify pinned formatter
        run: cargo fmt --all -- --check
      - name: Deny Rust warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test protocol, lifecycle, and all native targets
        run: cargo test --workspace --all-targets -j 1
      - name: Prove the unaccepted backend stays unavailable
        shell: pwsh
        run: |
          $status = cargo run --quiet -p blast-chambers-client -- doctor --json |
            ConvertFrom-Json
          if ($status.reason_code -ne "backend_unavailable") {
            throw "native backend activated without acceptance proof"
          }
          if ($status.identity_verified) {
            throw "uninstalled client claimed a verified service identity"
          }

  rust-security:
    name: Rust dependency security and policy
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: native/blast-chambers
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.96"
          manifest-path: native/blast-chambers/Cargo.toml
          arguments: --all-features --config native/blast-chambers/deny.toml
          command: check advisories bans licenses sources

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, rust]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: github/codeql-action/init@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0

  merge-gate:
    name: merge gate
    if: ${{ always() }}
    needs: [test, quality, build, artifact-uat, native, rust-security, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to succeed
        shell: python
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          import json
          import os

          results = {
              name: job["result"]
              for name, job in json.loads(os.environ["NEEDS_JSON"]).items()
          }
          failed = {name: result for name, result in results.items() if result != "success"}
          if failed:
              raise SystemExit(f"merge gate refused: {failed}")
          print(f"merge gate accepted: {results}")
